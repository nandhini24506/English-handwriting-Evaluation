{% extends "base.html" %}

{% block title %}Register - English Handwriting Evaluation System{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center my-4">
    <div class="col-md-7 col-lg-6">
        <div class="auth-card" style="max-width: 550px;">
            <div class="text-center mb-4">
                <div class="stat-icon bg-primary-subtle mx-auto mb-3" style="width: 60px; height: 60px; font-size: 1.6rem;">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h3 class="fw-bold">Create an Account</h3>
                <p class="text-muted small">Join the Handwriting Evaluation System</p>
            </div>

            <form method="POST" action="{{ url_for('register') }}">
                <div class="row g-3">
                    <div class="col-12">
                        <label for="name" class="form-label fw-medium">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="John Doe" required>
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label fw-medium">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="john@college.edu" required>
                    </div>

                    <div class="col-md-6">
                        <label for="roleSelect" class="form-label fw-medium">Role</label>
                        <select class="form-select" id="roleSelect" name="role" required>
                            <option value="student" selected>Student</option>
                            <option value="teacher">Teacher</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label for="password" class="form-label fw-medium">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Minimum 6 characters" minlength="6" required>
                    </div>
                </div>

                <!-- Conditional Student Fields -->
                <div id="studentFields" class="mt-3 p-3 bg-light rounded-3 border">
                    <h6 class="fw-bold text-primary mb-3"><i class="fa-solid fa-graduation-cap me-1"></i> Student Details</h6>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="roll_number" class="form-label fw-medium">Roll Number</label>
                            <input type="text" class="form-control" id="roll_number" name="roll_number" placeholder="CS2026-101" required>
                        </div>
                        <div class="col-md-6">
                            <label for="year" class="form-label fw-medium">Academic Year</label>
                            <select class="form-select" id="year" name="year" required>
                                <option value="1">1st Year</option>
                                <option value="2">2nd Year</option>
                                <option value="3">3rd Year</option>
                                <option value="4" selected>4th Year</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label for="department" class="form-label fw-medium">Department</label>
                            <input type="text" class="form-control" id="department" name="department" placeholder="Computer Science & Engineering" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 mt-4 mb-3">
                    <i class="fa-solid fa-user-check me-2"></i> Complete Registration
                </button>

                <div class="text-center text-muted small">
                    Already registered? <a href="{{ url_for('login') }}" class="text-primary fw-semibold text-decoration-none">Sign In Here</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
