{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="card">
    <div style="text-align: center; margin-bottom: 24px;">
      <div class="brand-icon" style="width: 44px; height: 44px; margin: 0 auto 12px; font-size: 20px;">E</div>
      <h1 class="page-title" style="font-size: 22px;">Welcome to EHE 2.0</h1>
      <p class="page-subtitle">Evaluate handwriting. Understand progress. Improve every day.</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="name@example.com" required
          autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="password-toggle-wrapper">
          <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
          <button type="button" class="password-toggle-btn" data-target="password" aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 8px;">
        Sign In
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted);">
      Don't have an account? <a href="{{ url_for('register') }}"
        style="color: var(--primary); font-weight: 600; text-decoration: none;">Register here</a>
    </div>
    <div style="text-align: center; margin-top: 12px; font-size: 12px;">
      <a href="{{ url_for('admin_login') }}" style="color: var(--text-muted); text-decoration: none;">Admin Sign In &rarr;</a>
    </div>
  </div>
</div>
{% endblock %}
